name: Checks

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  # Decides whether the Rust jobs (rust, coverage) need to run: they take most of the time, and
  # only files that change the sim's results matter to them. A manual run always runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.rust == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Find changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # data.json holds the strat conditions the Rust tests use; cases.js the saved test cases;
          # this file pins the Node version the parity tests need
          filters: |
            rust:
              - 'wasm/**'
              - 'src/Data/data.json'
              - 'bench/cases.js'
              - '.github/workflows/tests.yml'

  # Website: always runs
  website:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The build compiles the wasm module
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: npm install -g wasm-pack

      - name: Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'

      - name: Install dependencies
        run: npm install

      # Fails on new ESLint errors; existing ones are listed in eslint-suppressions.json
      - name: Lint (ESLint)
        run: npm run lint

      - name: TypeScript tests (Vitest)
        run: npm test

      # Type-checks all TypeScript, tests included (the webpack build leaves the tests out)
      - name: Type check
        run: npm run typecheck

      # Builds the wasm module and the website (webpack type-checks the website code)
      - name: Build
        run: npm run build

  # Rust: formatting, lints, unit tests and the sim-3 parity tests, when the sim may have changed
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Install wasm-pack
        run: npm install -g wasm-pack

      # Must be the Node major version the parity fixtures were generated with (see the "source" field
      # in wasm/tests/fixtures/sim3_results.json): JavaScript engines differ in the last digit of
      # Math.log10/Math.pow, and the parity tests compare results bit for bit.
      - name: Setup node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'

      - name: Formatting (rustfmt)
        run: cargo fmt --manifest-path wasm/Cargo.toml --check

      - name: Lint (clippy, no warnings allowed)
        run: cargo clippy --release --all-targets --manifest-path wasm/Cargo.toml -- -D warnings

      # Also lint the WebAssembly build: some code (e.g. the Math imports in fastmath.rs) only exists there
      - name: Lint (clippy, WebAssembly target)
        run: cargo clippy --release --all-targets --target wasm32-unknown-unknown --manifest-path wasm/Cargo.toml -- -D warnings

      - name: Unit tests
        run: cargo test --release --manifest-path wasm/Cargo.toml

      # Compares the Rust sim with results saved from sim-3 (wasm/tests/fixtures/sim3_results.json).
      # Runs as WebAssembly in Node, where results must match sim-3 bit for bit.
      - name: sim-3 parity tests
        run: wasm-pack test --node --release wasm --test sim3_parity

  coverage:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # Prebuilt binary (compiling it from source adds about a minute)
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Unit tests + the native coverage run (tests/coverage_cases.rs). Fails if line coverage of
      # wasm/src drops below the threshold; raise it as coverage improves (goal: 100%).
      - name: Coverage
        working-directory: wasm
        run: |
          cargo llvm-cov --release --lcov --output-path lcov.info --fail-under-lines 97 -- --include-ignored
          cargo llvm-cov report --release --summary-only

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-lcov
          path: wasm/lcov.info
